name: Auto-update Securo

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Securo release tag
        id: securo
        run: |
          TAG=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/securo-finance/securo/releases/latest" \
            | jq -r '.tag_name')

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "Failed to fetch latest Securo release" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Map Securo vX.Y.Z → addon 1.Y.Z so the addon version monotonically increases
          SEMVER="${TAG#v}"
          MINOR=$(echo "$SEMVER" | cut -d. -f2)
          PATCH=$(echo "$SEMVER" | cut -d. -f3)
          echo "addon_version=1.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Read currently pinned Securo version
        id: current
        run: |
          TAG=$(grep -oP '(?<=ARG SECURO_REF=)\S+' Dockerfile)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile and config.yaml
        if: steps.securo.outputs.tag != steps.current.outputs.tag
        env:
          NEW_TAG: ${{ steps.securo.outputs.tag }}
          ADDON_VER: ${{ steps.securo.outputs.addon_version }}
        run: |
          sed -i "s/^ARG SECURO_REF=.*/ARG SECURO_REF=${NEW_TAG}/" Dockerfile
          sed -i "s/^version: .*/version: \"${ADDON_VER}\"/" config.yaml

      - name: Commit and push
        if: steps.securo.outputs.tag != steps.current.outputs.tag
        env:
          NEW_TAG: ${{ steps.securo.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile config.yaml
          git commit -m "chore: bump Securo to ${NEW_TAG}"
          git push
