# Map X-Ingress-Path to a full <head> replacement string.
# When the header is absent (direct :3000 access), the replacement is a no-op
# so nginx sub_filter leaves the <head> tag unchanged and no base href is set.
map $http_x_ingress_path $ha_ingress_head_replacement {
    default  '<head>';
    ~^(/.+)  '<head><base href="$1/">';
}
