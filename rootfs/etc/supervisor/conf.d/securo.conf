[supervisord]
nodaemon=false
user=root
logfile=/data/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

# ------------------------------------------------------------------ #
# Backend — FastAPI via uvicorn
# ------------------------------------------------------------------ #
[program:backend]
command=/opt/securo/scripts/start-backend.sh
directory=/opt/securo/backend
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=10
stdout_logfile=/data/logs/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/backend-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

# ------------------------------------------------------------------ #
# Celery worker — async task execution (bank sync, reports, etc.)
# ------------------------------------------------------------------ #
[program:celery-worker]
command=/opt/securo-venv/bin/celery -A app.worker worker --loglevel=info --concurrency=2
directory=/opt/securo/backend
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
stdout_logfile=/data/logs/celery-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/celery-worker-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

# ------------------------------------------------------------------ #
# Celery beat — scheduled task dispatcher
# ------------------------------------------------------------------ #
[program:celery-beat]
command=/opt/securo-venv/bin/celery -A app.worker beat --loglevel=info
directory=/opt/securo/backend
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=21
stdout_logfile=/data/logs/celery-beat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/celery-beat-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

# ------------------------------------------------------------------ #
# Nginx — serves the React frontend and proxies /api/ to the backend
# ------------------------------------------------------------------ #
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
priority=30
stdout_logfile=/data/logs/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/data/logs/nginx-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
